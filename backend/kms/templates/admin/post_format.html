{% extends "admin/_base.html" %}
{% block content %}
<div class="box">
  <div class="box-header"><h3 class="box-title">Choose a Post Format</h3></div>
  <div class="box-body">
    <div class="format-grid">
      {% for f in formats %}
      {% if f.enabled %}
      <a href="/admin/add-post?type={{ f.key }}" class="format-card">
        <div class="format-name">{{ f.label }}</div>
      </a>
      {% else %}
      <div class="format-card format-disabled" title="Disabled in Settings → Preferences">
        <div class="format-name">{{ f.label }}</div>
        <span class="badge badge-muted">Disabled</span>
      </div>
      {% endif %}
      {% endfor %}
      {% for key, label in coming %}
      <div class="format-card format-disabled" title="Ships in a later Phase-4 pass">
        <div class="format-name">{{ label }}</div>
        <span class="badge badge-muted">Phase 4</span>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}

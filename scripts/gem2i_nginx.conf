server {
    listen 80;
    server_name beta.gem2i.com;
    client_max_body_size 50M;

    root /opt/beta.gem2i.com/frontend/build;
    index index.html;

    # FastAPI backend (API + uploaded media).
    location /api/uploads/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA — client-side routing fallback.
    # Cache policy (2026-10-17): HTML shell revalidated on every visit (deploys show
    # at once), hashed build assets immutable, API never cached except uploads.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

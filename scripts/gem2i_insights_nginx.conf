# insightsbeta.gem2i.com — KMS / Insights (magazine), ported from A Capital.
# The KMS router is mounted at /insights on the gem2i backend (:8050); its
# user-facing paths are root-relative, so this vhost maps / -> /insights/.
# TLS lines are added by certbot (--nginx). Copy to
# /etc/nginx/sites-available/insightsbeta.gem2i.com and symlink to sites-enabled.
server {
    listen 80;
    server_name insightsbeta.gem2i.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8050/insights/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
